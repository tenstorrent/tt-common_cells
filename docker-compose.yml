services:
  pulp-docker:
    image: hpretl/iic-osic-tools:2026.04
    environment:
      - UID=${UID}
      - GID=${GID}
    user: "${UID}:${GID}"
    volumes:
      - ./:/fosic/designs/common_cells
    stdin_open: true
    tty: true
    working_dir: /fosic/designs/common_cells
    entrypoint: /dockerstartup/scripts/ui_startup.sh
    command: --skip bash
